<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0c0c0b;--ink:#e9e4da;--red:#f40c3f;--line:rgba(233,228,218,.18);--mu:rgba(233,228,218,.62);
--sans:"Inter Tight","Inter Variable","Inter","Helvetica Neue",Arial,system-ui,sans-serif;--mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;--pad:clamp(20px,3.4vw,44px)}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:-2}
.shade{position:fixed;inset:0;z-index:-1;background:rgba(10,10,12,.62);pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}

.page{height:100vh;height:100svh;min-height:600px;display:grid;grid-template-rows:auto auto minmax(0,1fr);overflow:hidden}
.top{display:grid;grid-template-columns:minmax(0,1.25fr) repeat(3,minmax(0,1fr));gap:24px;padding:clamp(22px,3.4vw,40px) var(--pad) 0;font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;line-height:1.75}
.brand strong{display:block;font-weight:500}.brand span{opacity:.6}.brand a{text-decoration:none}
.col h2{font:inherit;opacity:.55}.col ul{list-style:none}
.lk{text-decoration:none;opacity:.85;background:linear-gradient(currentColor,currentColor) 0 100%/0% 1px no-repeat;transition:opacity .25s,background-size .35s cubic-bezier(.2,.7,.1,1)}
.lk:hover,.lk[aria-current]{opacity:1;background-size:100% 1px}
.short{display:none}
.rule{display:flex;justify-content:space-between;margin:clamp(14px,2.2vw,26px) var(--pad) 0;padding-top:12px;border-top:.5px solid var(--line);font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;opacity:.6}

.stage{display:grid;grid-template-columns:minmax(0,.62fr) minmax(0,1.38fr);gap:clamp(24px,4vw,64px);padding:clamp(14px,2vh,26px) var(--pad) clamp(18px,3vh,34px);min-height:0}
.side{display:flex;flex-direction:column;gap:clamp(12px,2vh,22px);min-height:0}
.list{display:flex;flex-direction:column;flex:1;min-height:0;list-style:none}
.list li{flex:1 1 0;min-height:0;max-height:120px;display:flex}
.row{flex:1;display:flex;align-items:center;gap:16px;min-width:0;border-bottom:.5px solid var(--line);opacity:.45;transition:opacity .25s,color .25s}
.row:hover,.row.on{opacity:1}.row.on{color:var(--red)}
.row .n{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;width:2.2em;flex:none}
.row .t{flex:1;min-width:0;font-weight:800;letter-spacing:-.03em;line-height:1;font-size:clamp(1.3rem,4.4vh,2.6rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .c{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;flex:none}
.desc{font-family:var(--mono);font-size:.74rem;line-height:1.8;color:var(--mu);max-width:44ch}

.sheet{display:grid;gap:8px;min-height:0;min-width:0;animation:in .3s ease}
@keyframes in{from{opacity:0}to{opacity:1}}
.tile{position:relative;min-width:0;min-height:0;overflow:hidden;border:.5px solid var(--line);background:rgba(12,12,11,.55)}
.tile img,.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:.88;transition:opacity .3s,transform .5s cubic-bezier(.2,.7,.1,1);-webkit-user-drag:none}
.tile:hover img,.tile:hover video,.tile:focus-visible img,.tile:focus-visible video{opacity:1;transform:scale(1.04)}
.tile:hover,.tile:focus-visible{border-color:var(--red)}
.tile .lb{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;line-height:1.5;background:linear-gradient(to top,rgba(10,10,12,.85),transparent);opacity:0;transition:opacity .25s}
.tile:hover .lb,.tile:focus-visible .lb{opacity:1}
.tile .lb i{display:block;font-style:normal;opacity:.6}
.tile .pl{position:absolute;top:8px;right:8px;font-family:var(--mono);font-size:9px;letter-spacing:.12em;padding:2px 7px;border:1px solid rgba(233,228,218,.5);border-radius:999px;background:rgba(10,10,12,.5)}

/* viewer */
.vw{position:fixed;inset:0;z-index:50;background:rgba(8,8,8,.97);display:none;grid-template-rows:minmax(0,1fr) auto auto;font-family:var(--mono)}
.vw.open{display:grid}
.vm{position:relative;min-height:0;display:flex;align-items:center;justify-content:center;padding:clamp(56px,8vh,72px) clamp(16px,6vw,88px) 8px;touch-action:pan-y}
.vm img,.vm video{max-width:100%;max-height:100%;object-fit:contain;-webkit-user-drag:none;user-select:none}
.vb{position:absolute;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;padding:12px 14px;opacity:.7;transition:opacity .25s,color .25s;z-index:2}
.vb:hover{opacity:1;color:var(--red)}
.vb.x{top:12px;right:var(--pad)}.vb.p,.vb.nx{top:50%;transform:translateY(-50%)}.vb.p{left:6px}.vb.nx{right:6px}
.bar{display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:12px var(--pad) 10px;border-top:.5px solid var(--line)}
.bar b{font-family:var(--sans);font-size:1.15rem;font-weight:800;letter-spacing:-.03em}
.bar small{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;opacity:.6;white-space:nowrap}
.th{display:flex;gap:6px;overflow-x:auto;padding:0 var(--pad) calc(16px + env(safe-area-inset-bottom,0px));scrollbar-width:thin}
.th button{flex:none;width:64px;height:48px;border:.5px solid var(--line);position:relative;opacity:.5;overflow:hidden;font-size:10px;text-align:center;line-height:48px}
.th button.on{opacity:1;border-color:var(--red)}
.th img{width:100%;height:100%;object-fit:cover;display:block}

@media(max-width:820px){
.top{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;font-size:9.5px;letter-spacing:.12em;padding-top:20px}
.brand{grid-column:1/-1}.full{display:none}.short{display:inline}
.rule{margin-top:12px;font-size:9.5px}
.stage{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:14px}
.list{flex-direction:row;flex-wrap:wrap;gap:6px;flex:none}
.list li{flex:0 0 calc(50% - 3px);max-height:none;height:42px}
.row{padding:0 12px;border:.5px solid var(--line);opacity:.6;gap:10px}.row.on{border-color:var(--red)}
.row .n{display:none}.row .t{font-size:.95rem}
.desc{display:none}
.vb.p,.vb.nx{top:auto;bottom:16px;transform:none}

@media(max-width:820px){
.page{height:auto;min-height:100svh;overflow:visible;grid-template-rows:auto auto auto}
.stage{grid-template-rows:auto auto}
.sheet{height:min(64svh,540px);min-height:340px}
.col a{display:inline-block;padding:3px 0}
}
@media(prefers-reduced-motion:reduce){.lk,.row,.tile img,.tile video,.tile .lb,.vb{transition:none}.sheet{animation:none}}
</style>

<script>
/* ── Shader de fondo (Hurricane Season, WebGL puro) ── */
(()=>{
const cv=document.getElementById('bg');
const gl=cv.getContext('webgl',{antialias:false});
if(!gl){cv.style.background='#2a0a14';return}
const VERT='attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const FRAG=`
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#define SEED 2208.0
#else
precision mediump float;
#define SEED 7.0
#endif
uniform vec3 u_c[5];
uniform vec4 u_s; // res.xy, time, cursor presence
uniform vec2 u_m;
float h21(vec2 p){
#ifndef GL_FRAGMENT_PRECISION_HIGH
p=mod(p,31.);
#endif
p=fract(p*vec2(234.34,435.345));p+=dot(p,p+34.23);return fract(p.x*p.y);}
float gh(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
float nz(vec2 p){vec2 i=floor(p),f=fract(p),u=f*f*(3.-2.*f);
return mix(mix(h21(i),h21(i+vec2(1.,0.)),u.x),mix(h21(i+vec2(0.,1.)),h21(i+vec2(1.,1.)),u.x),u.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*nz(p);p=p*2.03+vec2(17.,9.2);a*=.5;}return v;}
vec3 pal(float x){float f=clamp(x,0.,1.)*4.;vec3 c=u_c[0];
for(int i=0;i<4;i++)c=mix(c,u_c[i+1],smoothstep(0.,1.,clamp(f-float(i),0.,1.)));return c;}
vec3 shade(vec2 p,float t){
float fd=0.;
for(int i=0;i<7;i++){float fi=float(i);
vec2 c=vec2(sin(t*(.19+fi*.037)+fi*2.1+SEED),cos(t*(.16+fi*.043)+fi*1.4))*.63;
vec2 d=p-c;fd+=.0471/(dot(d,d)+.006);}
float s=smoothstep(.72,1.1,fd);
return pal(clamp(s+fd*.05,0.,1.));}
void main(){
vec2 R=u_s.xy;float t=u_s.z;float m=min(R.x,R.y);
vec2 p=(gl_FragCoord.xy-.5*R)/m;
if(u_s.w>.001){
vec2 cur=.5*u_m*R/m;vec2 d=p-cur;
float k=u_s.w*(1.-smoothstep(0.,.433,length(d)));
float a=k*2.2;float cc=cos(a),cs=sin(a);
p=cur+mat2(cc,-cs,cs,cc)*d;}
p*=1.44;
p=vec2(p.y,-p.x);
p+=.048*vec2(sin(t*.31),cos(t*.23));
p+=.6*(vec2(fbm(p*4.+SEED),fbm(p*4.+vec2(5.2,1.3)))-.5);
float e=.0576;
vec3 col=shade(p,t)*.36+(shade(p+vec2(e,0.),t)+shade(p-vec2(e,0.),t)+shade(p+vec2(0.,e),t)+shade(p-vec2(0.,e),t))*.16;
col=(col-.5)*1.5+.5;
float l=dot(col,vec3(.299,.587,.114));
col=mix(vec3(l),col,2.);
col-=.11;
col+=(gh(gl_FragCoord.xy+vec2(SEED*17.,SEED*31.))-.5)*.21;
gl_FragColor=vec4(clamp(col,0.,1.),1.);}`;
const mk=(t,s)=>{const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);return x};
const pr=gl.createProgram();
gl.attachShader(pr,mk(gl.VERTEX_SHADER,VERT));gl.attachShader(pr,mk(gl.FRAGMENT_SHADER,FRAG));
gl.linkProgram(pr);gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(pr,n);
gl.uniform3fv(U('u_c'),new Float32Array([.0196,.0196,.0235, 1,0,0, .9961,.9529,.7843, .4784,.8,0, .4078,.2431,.5333]));
const uS=U('u_s'),uM=U('u_m');
let tx=0,ty=0,tp=0,mx=0,my=0,cp=0,last=null,raf=0,vis=true;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
addEventListener('pointermove',e=>{tx=e.clientX/innerWidth*2-1;ty=-(e.clientY/innerHeight*2-1);tp=1;if(cp<.01){mx=tx;my=ty}},{passive:true});
document.documentElement.addEventListener('pointerleave',()=>tp=0);
addEventListener('blur',()=>tp=0);
function size(){
const d=Math.min(devicePixelRatio||1,2);
let w=Math.max(1,Math.round(innerWidth*d)),h=Math.max(1,Math.round(innerHeight*d));
const k=Math.min(1,Math.sqrt((innerWidth<820?9e5:2e6)/(w*h)));w=Math.round(w*k);h=Math.round(h*k);
if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;gl.viewport(0,0,w,h)}}
function frame(now){
raf=0;if(!vis)return;
const dt=last===null?0:Math.min((now-last)/1000,.1);last=now;
const f=1-Math.exp(-12*dt);
mx+=(tx-mx)*f;my+=(ty-my)*f;cp+=(tp-cp)*f;
size();
gl.uniform4f(uS,cv.width,cv.height,reduced?0:now/1000*1.088,cp);
gl.uniform2f(uM,mx,my);
gl.drawArrays(gl.TRIANGLES,0,3);
if(!reduced)raf=requestAnimationFrame(frame);}
addEventListener('resize',()=>{if(!raf)raf=requestAnimationFrame(frame)});
document.addEventListener('visibilitychange',()=>{vis=document.visibilityState==='visible';if(vis){last=null;if(!raf)raf=requestAnimationFrame(frame)}else{cancelAnimationFrame(raf);raf=0}});
raf=requestAnimationFrame(frame);
})();

(()=>{
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
const list=$('list'),vw=$('vw'),vc=$('vc'),thb=$('th');
let cat=-1,items=[],opener=null,vItem=null,vIdx=0,x0=null;

CATS.forEach((c,i)=>{
  const li=document.createElement('li'),b=document.createElement('button');
  b.className='row';b.type='button';
  b.innerHTML='<span class="n"></span><span class="t"></span><span class="c"></span>';
  b.children[0].textContent=pad(i+1);b.children[1].textContent=c.t;b.children[2].textContent=DATA[c.k].length;
  b.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')setCat(i)});
  b.addEventListener('focus',()=>setCat(i));
  b.addEventListener('click',()=>setCat(i));
  li.appendChild(b);list.appendChild(li);
});

function setCat(i){
  if(i===cat)return;cat=i;items=DATA[CATS[i].k];
  list.querySelectorAll('.row').forEach((r,k)=>r.classList.toggle('on',k===i));
  $('count').textContent=items.length+' pieces';
  const f=document.createDocumentFragment();
  items.forEach((it,k)=>{
    const b=document.createElement('button');b.type='button';b.className='tile';b.setAttribute('aria-label',it.t);
    if(it.th){const im=new Image();im.src=it.th;im.alt='';im.draggable=false;im.loading='lazy';b.appendChild(im)}
    else{const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='metadata';v.src=it.vid+'#t=0.1';b.appendChild(v)}
    if(it.m.some(x=>x.t==='v')){const p=document.createElement('span');p.className='pl';p.textContent='▶';b.appendChild(p)}
    const l=document.createElement('span');l.className='lb';l.textContent=it.t;const s=document.createElement('i');s.textContent=it.s;l.appendChild(s);b.appendChild(l);
    b.addEventListener('click',()=>openV(k,b));
    f.appendChild(b);
  });
  const ns=$('sheet');ns.textContent='';ns.style.animation='none';void ns.offsetWidth;ns.style.animation='';ns.appendChild(f);fit();
}

/* Reparte las miniaturas para que ocupen todo el alto disponible, sin scroll */
function fit(){
  const s=$('sheet'),n=items.length;if(!s||!n)return;
  const W=s.clientWidth,H=s.clientHeight,g=8;let best=1,score=1e9;
  for(let c=1;c<=n;c++){
    const r=Math.ceil(n/c),tw=(W-g*(c-1))/c,th=(H-g*(r-1))/r;
    if(tw<=0||th<=0)continue;
    const sc=Math.abs(Math.log(tw/th/1.2));if(sc<score){score=sc;best=c}
  }
  const r=Math.ceil(n/best),tw=(W-g*(best-1))/best,th=(H-g*(r-1))/r;
  s.style.gridTemplateColumns='repeat('+best+',minmax(0,1fr))';
  if(Math.min(tw,th)<72){s.style.gridAutoRows='84px';s.style.gridTemplateRows='';s.style.overflowY='auto';s.style.alignContent='start'}
  else{s.style.gridTemplateRows='repeat('+r+',minmax(0,1fr))';s.style.gridAutoRows='';s.style.overflowY='';s.style.alignContent=''}
}
new ResizeObserver(fit).observe(document.querySelector('.stage'));
addEventListener('keydown',e=>{
  if(vw.classList.contains('open')||!['ArrowUp','ArrowDown'].includes(e.key))return;
  e.preventDefault();setCat(Math.max(0,Math.min(CATS.length-1,cat+(e.key==='ArrowDown'?1:-1))));
  list.querySelectorAll('.row')[cat].focus({preventScroll:true});
});

/* ── Visor (imágenes y video) ── */
function openV(k,from){
  vItem=items[k];vIdx=0;opener=from;vw.classList.add('open');document.body.style.overflow='hidden';
  thb.textContent='';thb.style.display=vItem.m.length>1?'flex':'none';
  vItem.m.forEach((m,j)=>{
    const b=document.createElement('button');b.type='button';b.setAttribute('aria-label','Item '+(j+1));
    const th=m.th||(m.t==='i'?m.s:'');
    if(th){const im=new Image();im.src=th;im.alt='';im.draggable=false;b.appendChild(im)}else b.textContent='▶';
    b.addEventListener('click',()=>{vIdx=j;draw()});thb.appendChild(b);
  });
  draw();$('vx').focus();
}
function closeV(){vc.querySelectorAll('video').forEach(v=>v.pause());vc.textContent='';vw.classList.remove('open');document.body.style.overflow='';if(opener)opener.focus({preventScroll:true})}
function draw(){
  const m=vItem.m[vIdx];vc.querySelectorAll('video').forEach(v=>v.pause());vc.textContent='';
  if(m.t==='v'){
    const v=document.createElement('video');v.src=m.s;v.controls=true;v.autoplay=true;v.loop=true;v.muted=true;v.playsInline=true;
    v.setAttribute('controlslist','nodownload noremoteplayback');v.disablePictureInPicture=true;v.oncontextmenu=()=>false;vc.appendChild(v);
  }else{const im=new Image();im.src=m.s;im.alt=vItem.t+' — '+(vIdx+1);im.draggable=false;vc.appendChild(im)}
  $('vt').textContent=vItem.t;$('vk').textContent=vItem.s+' · '+pad(vIdx+1)+' / '+pad(vItem.m.length);
  const multi=vItem.m.length>1;$('vp').hidden=!multi;$('vn').hidden=!multi;
  [...thb.children].forEach((b,j)=>{b.classList.toggle('on',j===vIdx);if(j===vIdx)b.scrollIntoView({inline:'center',block:'nearest'})});
}
const step=d=>{vIdx=(vIdx+d+vItem.m.length)%vItem.m.length;draw()};
$('vx').onclick=closeV;$('vp').onclick=()=>step(-1);$('vn').onclick=()=>step(1);
$('vm').addEventListener('click',e=>{if(e.target===$('vm'))closeV()});
$('vm').addEventListener('pointerdown',e=>{x0=e.target.tagName==='VIDEO'?null:e.clientX});
$('vm').addEventListener('pointerup',e=>{if(x0!==null&&Math.abs(e.clientX-x0)>50&&vItem.m.length>1)step(e.clientX<x0?1:-1);x0=null});
addEventListener('keydown',e=>{
  if(!vw.classList.contains('open'))return;
  if(e.key==='Escape')closeV();
  else if(e.key==='ArrowRight'&&vItem.m.length>1)step(1);
  else if(e.key==='ArrowLeft'&&vItem.m.length>1)step(-1);
});
document.addEventListener('contextmenu',e=>{if(e.target.tagName==='IMG'||e.target.tagName==='VIDEO')e.preventDefault()});
document.addEventListener('dragstart',e=>{if(e.target.tagName==='IMG')e.preventDefault()});
setCat(0);
})();
</script>
