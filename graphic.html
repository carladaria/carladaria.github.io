<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0c0c0b;--ink:#e9e4da;--red:#f40c3f;--line:rgba(233,228,218,.18);--mu:rgba(233,228,218,.62);
--sans:"Inter Tight","Inter Variable","Inter","Helvetica Neue",Arial,system-ui,sans-serif;--mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;--pad:clamp(20px,3.4vw,44px)}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:-2}
.shade{position:fixed;inset:0;z-index:-1;background:rgba(10,10,12,.62);pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}

.page{height:100vh;height:100svh;min-height:600px;display:grid;grid-template-rows:auto auto minmax(0,1fr);overflow:hidden}
.top{display:grid;grid-template-columns:minmax(0,1.25fr) repeat(3,minmax(0,1fr));gap:24px;padding:clamp(22px,3.4vw,40px) var(--pad) 0;font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;line-height:1.75}
.brand strong{display:block;font-weight:500}.brand span{opacity:.6}.brand a{text-decoration:none}
.col h2{font:inherit;opacity:.55}.col ul{list-style:none}
.lk{text-decoration:none;opacity:.85;background:linear-gradient(currentColor,currentColor) 0 100%/0% 1px no-repeat;transition:opacity .25s,background-size .35s cubic-bezier(.2,.7,.1,1)}
.lk:hover,.lk[aria-current]{opacity:1;background-size:100% 1px}
.short{display:none}
.rule{display:flex;justify-content:space-between;margin:clamp(14px,2.2vw,26px) var(--pad) 0;padding-top:12px;border-top:.5px solid var(--line);font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;opacity:.6}

.stage{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(24px,4vw,64px);padding:clamp(14px,2vh,26px) var(--pad) clamp(18px,3vh,34px);min-height:0}
.list{display:flex;flex-direction:column;min-height:0;list-style:none}
.list li{flex:1 1 0;min-height:0;max-height:72px;display:flex}
.row{flex:1;display:flex;align-items:center;gap:18px;min-width:0;border-bottom:.5px solid var(--line);opacity:.45;transition:opacity .25s,color .25s}
.row:hover,.row.on{opacity:1}.row.on{color:var(--red)}
.row .n{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;width:2.2em;flex:none}
.row .t{font-weight:800;letter-spacing:-.03em;line-height:1;font-size:clamp(1rem,3.2vh,1.9rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.view{display:flex;flex-direction:column;gap:clamp(10px,1.8vh,18px);min-height:0;min-width:0}
.frame{position:relative;flex:1;min-height:0;border:.5px solid var(--line);background:rgba(12,12,11,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:zoom-in}
.frame img{max-width:100%;max-height:100%;object-fit:contain;display:block;transition:opacity .3s;-webkit-user-drag:none;user-select:none}
.frame img.out{opacity:0}
.meta{display:flex;flex-direction:column;gap:10px;font-family:var(--mono)}
.meta .l{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;opacity:.6}
.meta h2{display:none;font-family:var(--sans);font-size:1.5rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.meta{position:relative}
.mt{position:relative;max-width:68ch}
.meta p{font-size:.74rem;line-height:1.8;color:var(--mu);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;padding-right:2.6em}
.more,.fx{position:absolute;right:0;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:50%;font-family:var(--mono);font-size:12px;line-height:1;color:var(--mu);transition:color .25s,border-color .25s,transform .25s}
.more{bottom:1px}.fx{top:10px;right:10px}
.more:hover,.fx:hover{color:var(--red);border-color:var(--red)}
.more:hover{transform:translateY(2px)}
.more[hidden],.full[hidden]{display:none}
.full{position:absolute;left:0;bottom:-6px;z-index:5;width:min(100%,84ch);max-height:min(62vh,440px);overflow:auto;padding:18px 52px 18px 18px;background:rgba(12,12,11,.96);border:.5px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:in .25s ease;scrollbar-width:thin}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.meta .full p{display:block;-webkit-line-clamp:unset;overflow:visible;padding:0;color:var(--ink);opacity:.9;font-size:.78rem;line-height:1.85}
.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:.62rem;letter-spacing:.08em;padding:3px 10px;border:1px solid var(--line);border-radius:999px;color:var(--mu)}
.cta{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;padding:10px 18px;border:1px solid var(--ink);transition:background .25s,color .25s,border-color .25s;white-space:nowrap}
.cta:hover{background:var(--red);border-color:var(--red);color:#fff}

/* viewer */
.vw{position:fixed;inset:0;z-index:50;background:rgba(8,8,8,.97);display:none;grid-template-rows:minmax(0,1fr) auto;font-family:var(--mono)}
.vw.open{display:grid}
.vw .img{position:relative;min-height:0;display:flex;align-items:center;justify-content:center;padding:clamp(56px,8vh,72px) clamp(16px,6vw,88px) 8px;touch-action:pan-y}
.vw img{max-width:100%;max-height:100%;object-fit:contain;-webkit-user-drag:none;user-select:none}
.vw .bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 24px;padding:14px var(--pad) calc(18px + env(safe-area-inset-bottom,0px));border-top:.5px solid var(--line)}
.vw .bar b{font-family:var(--sans);font-size:1.15rem;font-weight:800;letter-spacing:-.03em}
.vw .bar small{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;opacity:.6;align-self:center}
.vb{position:absolute;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;padding:12px 14px;opacity:.7;transition:opacity .25s,color .25s}
.vb:hover{opacity:1;color:var(--red)}
.vb.x{top:12px;right:var(--pad)}.vb.p,.vb.nx{top:50%;transform:translateY(-50%)}.vb.p{left:6px}.vb.nx{right:6px}

@media(max-width:820px){
.page{grid-template-rows:auto auto minmax(0,1fr)}
.top{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;font-size:9.5px;letter-spacing:.12em;padding-top:20px}
.brand{grid-column:1/-1}.full{display:none}.short{display:inline}
.rule{margin-top:12px;font-size:9.5px}
.stage{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:14px}
.view{order:1}.list{order:2;flex-direction:row;flex-wrap:wrap;gap:6px}
.list li{flex:0 0 calc((100% - 30px)/6);max-height:none;height:38px}
.row{justify-content:center;border:.5px solid var(--line);opacity:.6}.row .t{display:none}.row .n{width:auto;font-size:10px;letter-spacing:.08em}
.row.on{border-color:var(--red)}
.meta h2{display:block}.meta p{-webkit-line-clamp:3;font-size:.7rem}
.cta{padding:9px 14px}
.vb.p,.vb.nx{top:auto;bottom:130px;transform:none}
}
@media(max-width:820px) and (max-height:700px){.tags{display:none}}
@media(max-width:820px){
.page{height:auto;min-height:100svh;overflow:visible;grid-template-rows:auto auto auto}
.stage{grid-template-rows:auto auto}
.frame{flex:none;height:min(50svh,420px);min-height:240px}
.col a{display:inline-block;padding:3px 0}
}
@media(prefers-reduced-motion:reduce){.lk,.row,.frame img,.cta,.vb{transition:none}}
</style>

<script>
/* ── Shader de fondo (Hurricane Season, WebGL puro) ── */
(()=>{
const cv=document.getElementById('bg');
const gl=cv.getContext('webgl',{antialias:false});
if(!gl){cv.style.background='#2a0a14';return}
const VERT='attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const FRAG=`
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#define SEED 2208.0
#else
precision mediump float;
#define SEED 7.0
#endif
uniform vec3 u_c[5];
uniform vec4 u_s; // res.xy, time, cursor presence
uniform vec2 u_m;
float h21(vec2 p){
#ifndef GL_FRAGMENT_PRECISION_HIGH
p=mod(p,31.);
#endif
p=fract(p*vec2(234.34,435.345));p+=dot(p,p+34.23);return fract(p.x*p.y);}
float gh(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
float nz(vec2 p){vec2 i=floor(p),f=fract(p),u=f*f*(3.-2.*f);
return mix(mix(h21(i),h21(i+vec2(1.,0.)),u.x),mix(h21(i+vec2(0.,1.)),h21(i+vec2(1.,1.)),u.x),u.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*nz(p);p=p*2.03+vec2(17.,9.2);a*=.5;}return v;}
vec3 pal(float x){float f=clamp(x,0.,1.)*4.;vec3 c=u_c[0];
for(int i=0;i<4;i++)c=mix(c,u_c[i+1],smoothstep(0.,1.,clamp(f-float(i),0.,1.)));return c;}
vec3 shade(vec2 p,float t){
float fd=0.;
for(int i=0;i<7;i++){float fi=float(i);
vec2 c=vec2(sin(t*(.19+fi*.037)+fi*2.1+SEED),cos(t*(.16+fi*.043)+fi*1.4))*.63;
vec2 d=p-c;fd+=.0471/(dot(d,d)+.006);}
float s=smoothstep(.72,1.1,fd);
return pal(clamp(s+fd*.05,0.,1.));}
void main(){
vec2 R=u_s.xy;float t=u_s.z;float m=min(R.x,R.y);
vec2 p=(gl_FragCoord.xy-.5*R)/m;
if(u_s.w>.001){
vec2 cur=.5*u_m*R/m;vec2 d=p-cur;
float k=u_s.w*(1.-smoothstep(0.,.433,length(d)));
float a=k*2.2;float cc=cos(a),cs=sin(a);
p=cur+mat2(cc,-cs,cs,cc)*d;}
p*=1.44;
p=vec2(p.y,-p.x);
p+=.048*vec2(sin(t*.31),cos(t*.23));
p+=.6*(vec2(fbm(p*4.+SEED),fbm(p*4.+vec2(5.2,1.3)))-.5);
float e=.0576;
vec3 col=shade(p,t)*.36+(shade(p+vec2(e,0.),t)+shade(p-vec2(e,0.),t)+shade(p+vec2(0.,e),t)+shade(p-vec2(0.,e),t))*.16;
col=(col-.5)*1.5+.5;
float l=dot(col,vec3(.299,.587,.114));
col=mix(vec3(l),col,2.);
col-=.11;
col+=(gh(gl_FragCoord.xy+vec2(SEED*17.,SEED*31.))-.5)*.21;
gl_FragColor=vec4(clamp(col,0.,1.),1.);}`;
const mk=(t,s)=>{const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);return x};
const pr=gl.createProgram();
gl.attachShader(pr,mk(gl.VERTEX_SHADER,VERT));gl.attachShader(pr,mk(gl.FRAGMENT_SHADER,FRAG));
gl.linkProgram(pr);gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(pr,n);
gl.uniform3fv(U('u_c'),new Float32Array([.0196,.0196,.0235, 1,0,0, .9961,.9529,.7843, .4784,.8,0, .4078,.2431,.5333]));
const uS=U('u_s'),uM=U('u_m');
let tx=0,ty=0,tp=0,mx=0,my=0,cp=0,last=null,raf=0,vis=true;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
addEventListener('pointermove',e=>{tx=e.clientX/innerWidth*2-1;ty=-(e.clientY/innerHeight*2-1);tp=1;if(cp<.01){mx=tx;my=ty}},{passive:true});
document.documentElement.addEventListener('pointerleave',()=>tp=0);
addEventListener('blur',()=>tp=0);
function size(){
const d=Math.min(devicePixelRatio||1,2);
let w=Math.max(1,Math.round(innerWidth*d)),h=Math.max(1,Math.round(innerHeight*d));
const k=Math.min(1,Math.sqrt((innerWidth<820?9e5:2e6)/(w*h)));w=Math.round(w*k);h=Math.round(h*k);
if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;gl.viewport(0,0,w,h)}}
function frame(now){
raf=0;if(!vis)return;
const dt=last===null?0:Math.min((now-last)/1000,.1);last=now;
const f=1-Math.exp(-12*dt);
mx+=(tx-mx)*f;my+=(ty-my)*f;cp+=(tp-cp)*f;
size();
gl.uniform4f(uS,cv.width,cv.height,reduced?0:now/1000*1.088,cp);
gl.uniform2f(uM,mx,my);
gl.drawArrays(gl.TRIANGLES,0,3);
if(!reduced)raf=requestAnimationFrame(frame);}
addEventListener('resize',()=>{if(!raf)raf=requestAnimationFrame(frame)});
document.addEventListener('visibilitychange',()=>{vis=document.visibilityState==='visible';if(vis){last=null;if(!raf)raf=requestAnimationFrame(frame)}else{cancelAnimationFrame(raf);raf=0}});
raf=requestAnimationFrame(frame);
})();

/* ── Índice + vista previa ── */
(()=>{
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');
const list=$('list'),pimg=$('pimg'),frame=$('frame'),cta=$('cta');
let cur=-1,opener=null;
$('count').textContent=ITEMS.length+' works';
ITEMS.forEach((it,i)=>{
  const li=document.createElement('li'),b=document.createElement('button');
  b.className='row';b.type='button';b.setAttribute('aria-label',it.t);
  b.innerHTML='<span class="n"></span><span class="t"></span>';
  b.firstChild.textContent=pad(i+1);b.lastChild.textContent=it.t;
  b.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')show(i)});
  b.addEventListener('focus',()=>show(i));
  b.addEventListener('click',()=>show(i));
  li.appendChild(b);list.appendChild(li);
});
function show(i){
  if(i===cur)return;cur=i;const it=ITEMS[i];
  [...list.querySelectorAll('.row')].forEach((r,k)=>r.classList.toggle('on',k===i));
  pimg.classList.add('out');
  const nx=new Image();nx.onload=nx.onerror=()=>{if(cur!==i)return;pimg.src=it.i[0];pimg.alt=it.t;pimg.classList.remove('out')};nx.src=it.i[0];
  $('pl').textContent=it.l;$('pt').textContent=it.t;$('pd').textContent=it.d;
  const g=$('pg');g.textContent='';it.g.forEach(t=>{const s=document.createElement('span');s.textContent=t;g.appendChild(s)});
  cta.textContent='';
  if(it.h){const a=document.createElement('a');a.className='cta';a.href=it.h;a.target='_blank';a.rel='noopener noreferrer';a.textContent='View on Figma ↗';cta.appendChild(a);frame.style.cursor='default'}
  else{const b=document.createElement('button');b.className='cta';b.type='button';b.textContent='View project · '+it.i.length;b.addEventListener('click',e=>openV(i,e.currentTarget));cta.appendChild(b);frame.style.cursor='zoom-in'}
}
frame.addEventListener('click',e=>{const it=ITEMS[cur];if(it&&it.h)window.open(it.h,'_blank','noopener');else openV(cur,frame)});
addEventListener('keydown',e=>{
  if(vw.classList.contains('open')||!['ArrowUp','ArrowDown'].includes(e.key))return;
  e.preventDefault();show(Math.max(0,Math.min(ITEMS.length-1,cur+(e.key==='ArrowDown'?1:-1))));
  list.querySelectorAll('.row')[cur].focus({preventScroll:true});
});

/* ── Visor ── */
const vw=$('vw'),vi=$('vi');let vIdx=0,vItem=null,x0=null;
function openV(i,from){setFull(false);vItem=ITEMS[i];vIdx=0;opener=from;vw.classList.add('open');document.body.style.overflow='hidden';draw();$('vx').focus()}
function closeV(){vw.classList.remove('open');document.body.style.overflow='';if(opener)opener.focus({preventScroll:true})}
function draw(){
  vi.src=vItem.i[vIdx];vi.alt=vItem.t+' — '+(vIdx+1);
  $('vt').textContent=vItem.t;$('vc').textContent=pad(vIdx+1)+' / '+pad(vItem.i.length);
  const m=vItem.i.length<2;$('vp').hidden=m;$('vn').hidden=m;
}
const step=d=>{vIdx=(vIdx+d+vItem.i.length)%vItem.i.length;draw()};
$('vx').onclick=closeV;$('vp').onclick=()=>step(-1);$('vn').onclick=()=>step(1);
$('vimg').addEventListener('click',e=>{if(e.target===$('vimg'))closeV()});
$('vimg').addEventListener('pointerdown',e=>{x0=e.clientX});
$('vimg').addEventListener('pointerup',e=>{if(x0!==null&&Math.abs(e.clientX-x0)>50&&vItem.i.length>1)step(e.clientX<x0?1:-1);x0=null});
addEventListener('keydown',e=>{
  if(!vw.classList.contains('open'))return;
  if(e.key==='Escape')closeV();
  else if(e.key==='ArrowRight'&&vItem.i.length>1)step(1);
  else if(e.key==='ArrowLeft'&&vItem.i.length>1)step(-1);
});

/* protección de imágenes, como en la versión anterior */
document.addEventListener('contextmenu',e=>{if(e.target.tagName==='IMG')e.preventDefault()});
document.addEventListener('dragstart',e=>{if(e.target.tagName==='IMG')e.preventDefault()});
const more=$('more'),full=$('full'),pd=$('pd');
function setFull(o){full.hidden=!o;more.setAttribute('aria-expanded',o)}
function chk(){more.hidden=!(pd.scrollHeight>pd.clientHeight+1);if(more.hidden)setFull(false)}
more.addEventListener('click',()=>setFull(full.hidden));
$('fx').addEventListener('click',()=>{setFull(false);more.focus()});
document.addEventListener('click',e=>{if(!full.hidden&&!full.contains(e.target)&&e.target!==more)setFull(false)});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!full.hidden&&!vw.classList.contains('open'))setFull(false)});
addEventListener('resize',chk);
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(chk);
const _show=show;show=function(i){const c=cur;_show(i);if(i!==c){$('pf').textContent=ITEMS[i].d;setFull(false);chk()}};
show(0);
})();
</script>
