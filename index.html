*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0c0c0b;--ink:#e9e4da;--warm:#ffcd3c;--line:rgba(233,228,218,.18);--mu:rgba(233,228,218,.62);
--sans:"Inter Tight","Inter Variable","Inter","Helvetica Neue",Arial,system-ui,sans-serif;--mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace}
body{min-height:100svh}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit}

.hwf{position:relative;height:100vh;height:100svh;min-height:560px;overflow:hidden;touch-action:pan-y;isolation:isolate}
.hwf canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.top{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.25fr) repeat(3,minmax(0,1fr));gap:24px;
padding:clamp(22px,3.4vw,40px) clamp(20px,3.4vw,44px) 0;font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;line-height:1.75}
.brand strong{display:block;font-weight:500}.brand span{opacity:.6}
.col h2{font:inherit;opacity:.55}
.col ul{list-style:none}
.lk{text-decoration:none;opacity:.85;background:linear-gradient(currentColor,currentColor) 0 100%/0% 1px no-repeat;transition:opacity .25s,background-size .35s cubic-bezier(.2,.7,.1,1)}
.lk:hover{opacity:1;background-size:100% 1px}
.lk:focus-visible{outline:2px solid var(--warm);outline-offset:3px}
.short{display:none}
.rule{position:relative;z-index:1;display:flex;justify-content:flex-end;margin:clamp(18px,2.6vw,30px) clamp(20px,3.4vw,44px) 0;padding-top:12px;border-top:.5px solid var(--line);font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase}


@media(max-width:720px){
.top{grid-template-columns:minmax(0,1fr) minmax(0,1fr);row-gap:18px}.brand{grid-column:1/-1}
.full{display:none}.short{display:inline}.col a{display:inline-block;padding:3px 0}
}
@media(prefers-reduced-motion:reduce){.lk{transition:none}}

<script>
/* ── Shader de fondo (Hurricane Season, WebGL puro) ── */
(()=>{
const cv=document.getElementById('bg');
const gl=cv.getContext('webgl',{antialias:false});
if(!gl){cv.style.background='#2a0a14';return}
const VERT='attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const FRAG=`
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#define SEED 2208.0
#else
precision mediump float;
#define SEED 7.0
#endif
uniform vec3 u_c[5];
uniform vec4 u_s; // res.xy, time, cursor presence
uniform vec2 u_m;
float h21(vec2 p){
#ifndef GL_FRAGMENT_PRECISION_HIGH
p=mod(p,31.);
#endif
p=fract(p*vec2(234.34,435.345));p+=dot(p,p+34.23);return fract(p.x*p.y);}
float gh(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
float nz(vec2 p){vec2 i=floor(p),f=fract(p),u=f*f*(3.-2.*f);
return mix(mix(h21(i),h21(i+vec2(1.,0.)),u.x),mix(h21(i+vec2(0.,1.)),h21(i+vec2(1.,1.)),u.x),u.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*nz(p);p=p*2.03+vec2(17.,9.2);a*=.5;}return v;}
vec3 pal(float x){float f=clamp(x,0.,1.)*4.;vec3 c=u_c[0];
for(int i=0;i<4;i++)c=mix(c,u_c[i+1],smoothstep(0.,1.,clamp(f-float(i),0.,1.)));return c;}
vec3 shade(vec2 p,float t){
float fd=0.;
for(int i=0;i<7;i++){float fi=float(i);
vec2 c=vec2(sin(t*(.19+fi*.037)+fi*2.1+SEED),cos(t*(.16+fi*.043)+fi*1.4))*.63;
vec2 d=p-c;fd+=.0471/(dot(d,d)+.006);}
float s=smoothstep(.72,1.1,fd);
return pal(clamp(s+fd*.05,0.,1.));}
void main(){
vec2 R=u_s.xy;float t=u_s.z;float m=min(R.x,R.y);
vec2 p=(gl_FragCoord.xy-.5*R)/m;
if(u_s.w>.001){
vec2 cur=.5*u_m*R/m;vec2 d=p-cur;
float k=u_s.w*(1.-smoothstep(0.,.433,length(d)));
float a=k*2.2;float cc=cos(a),cs=sin(a);
p=cur+mat2(cc,-cs,cs,cc)*d;}
p*=1.44;
p=vec2(p.y,-p.x);
p+=.048*vec2(sin(t*.31),cos(t*.23));
p+=.6*(vec2(fbm(p*4.+SEED),fbm(p*4.+vec2(5.2,1.3)))-.5);
float e=.0576;
vec3 col=shade(p,t)*.36+(shade(p+vec2(e,0.),t)+shade(p-vec2(e,0.),t)+shade(p+vec2(0.,e),t)+shade(p-vec2(0.,e),t))*.16;
col=(col-.5)*1.5+.5;
float l=dot(col,vec3(.299,.587,.114));
col=mix(vec3(l),col,2.);
col-=.11;
col+=(gh(gl_FragCoord.xy+vec2(SEED*17.,SEED*31.))-.5)*.21;
gl_FragColor=vec4(clamp(col,0.,1.),1.);}`;
const mk=(t,s)=>{const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);return x};
const pr=gl.createProgram();
gl.attachShader(pr,mk(gl.VERTEX_SHADER,VERT));gl.attachShader(pr,mk(gl.FRAGMENT_SHADER,FRAG));
gl.linkProgram(pr);gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(pr,n);
gl.uniform3fv(U('u_c'),new Float32Array([.0196,.0196,.0235, 1,0,0, .9961,.9529,.7843, .4784,.8,0, .4078,.2431,.5333]));
const uS=U('u_s'),uM=U('u_m');
let tx=0,ty=0,tp=0,mx=0,my=0,cp=0,last=null,raf=0,vis=true;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
addEventListener('pointermove',e=>{tx=e.clientX/innerWidth*2-1;ty=-(e.clientY/innerHeight*2-1);tp=1;if(cp<.01){mx=tx;my=ty}},{passive:true});
document.documentElement.addEventListener('pointerleave',()=>tp=0);
addEventListener('blur',()=>tp=0);
function size(){
const d=Math.min(devicePixelRatio||1,2);
let w=Math.max(1,Math.round(innerWidth*d)),h=Math.max(1,Math.round(innerHeight*d));
const k=Math.min(1,Math.sqrt((innerWidth<820?9e5:2e6)/(w*h)));w=Math.round(w*k);h=Math.round(h*k);
if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;gl.viewport(0,0,w,h)}}
function frame(now){
raf=0;if(!vis)return;
const dt=last===null?0:Math.min((now-last)/1000,.1);last=now;
const f=1-Math.exp(-12*dt);
mx+=(tx-mx)*f;my+=(ty-my)*f;cp+=(tp-cp)*f;
size();
gl.uniform4f(uS,cv.width,cv.height,reduced?0:now/1000*1.088,cp);
gl.uniform2f(uM,mx,my);
gl.drawArrays(gl.TRIANGLES,0,3);
if(!reduced)raf=requestAnimationFrame(frame);}
addEventListener('resize',()=>{if(!raf)raf=requestAnimationFrame(frame)});
document.addEventListener('visibilitychange',()=>{vis=document.visibilityState==='visible';if(vis){last=null;if(!raf)raf=requestAnimationFrame(frame)}else{cancelAnimationFrame(raf);raf=0}});
raf=requestAnimationFrame(frame);
})();

/* ── Wordmark halftone "CARLA" (hero) ── */
(()=>{
const hero=document.getElementById('hero'),cv=document.getElementById('ht'),ctx=cv.getContext('2d');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const WORD='carla',FACE='"Inter Tight","Inter Variable","Inter","Helvetica Neue",Arial,system-ui,sans-serif',WT=800,CROP=.2;
const INK=[214,209,199],WARM=[244,12,63],INKS='rgb(214,209,199)';
let w=0,h=0,dpr=1,dots=new Float32Array(0),n=0,px=-1e5,py=-1e5,raf=0,vis=true,awake=true,ring={x:0,y:0,t:-1},R=80,sc=1,SP=28;

function layout(){
const b=hero.getBoundingClientRect();
w=Math.max(1,Math.round(b.width));h=Math.max(1,Math.round(b.height));
dpr=Math.min(devicePixelRatio||1,2);
cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
const gap=Math.max(4,Math.round(w/150));sc=gap/6;SP=28*sc;R=Math.max(56,w*.06);
const mk=document.createElement('canvas');mk.width=w;mk.height=h;
const m=mk.getContext('2d',{willReadFrequently:true});
m.font=WT+' 100px '+FACE;
const fit=w*1.02/m.measureText(WORD).width*100;
m.font=WT+' '+fit+'px '+FACE;
const box=m.measureText(WORD);
const cap=box.actualBoundingBoxAscent||fit*.72;
m.fillStyle='#000';m.textBaseline='alphabetic';
m.fillText(WORD,(w-box.width)/2,h+cap*CROP);
const img=m.getImageData(0,0,w,h).data;
const cols=Math.ceil(w/gap),rows=Math.ceil(h/gap),tmp=[];
for(let gy=0;gy<rows;gy++)for(let gx=0;gx<cols;gx++){
let s=0;
for(let sy=0;sy<3;sy++)for(let sx=0;sx<3;sx++){
const x=Math.min(w-1,Math.floor(gx*gap+(sx+.5)*gap/3)),y=Math.min(h-1,Math.floor(gy*gap+(sy+.5)*gap/3));
s+=img[(y*w+x)*4+3];}
const cov=s/2295;if(cov<.06)continue;
const hx=gx*gap+gap/2,hy=gy*gap+gap/2;
tmp.push(hx,hy,0,0,hx,hy,Math.sqrt(cov)*gap*.54);}
dots=new Float32Array(tmp);n=tmp.length/7;awake=true;}

function draw(now){
ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
const r=reduced?0:R,age=ring.t<0?1e9:now-ring.t,rr=age*.9*sc;let moving=false;
for(let i=0;i<n;i++){
const j=i*7;let x=dots[j],y=dots[j+1],vx=dots[j+2],vy=dots[j+3];const hx=dots[j+4],hy=dots[j+5];
if(!reduced){
if(age<900){const dx=hx-ring.x,dy=hy-ring.y,d=Math.sqrt(dx*dx+dy*dy)+.001,band=1-Math.min(1,Math.abs(d-rr)/(26*sc));
if(band>0){const f=band*3.2*sc*(1-age/900);vx+=dx/d*f;vy+=dy/d*f}}
const ddx=x-px,ddy=y-py,d2=ddx*ddx+ddy*ddy;
if(r>0&&d2<r*r){const d=Math.sqrt(d2)+.001,f=(1-d/r)*2.6*sc;vx+=ddx/d*f;vy+=ddy/d*f}
vx=(vx+(hx-x)*.05)*.84;vy=(vy+(hy-y)*.05)*.84;x+=vx;y+=vy;
if(Math.abs(vx)+Math.abs(vy)>.02||Math.abs(x-hx)+Math.abs(y-hy)>.05)moving=true;
else{x=hx;y=hy;vx=vy=0}
dots[j]=x;dots[j+1]=y;dots[j+2]=vx;dots[j+3]=vy;}
const k=Math.min(1,Math.hypot(x-hx,y-hy)/SP);
ctx.fillStyle=k>.02?'rgb('+Math.round(INK[0]+(WARM[0]-INK[0])*k)+','+Math.round(INK[1]+(WARM[1]-INK[1])*k)+','+Math.round(INK[2]+(WARM[2]-INK[2])*k)+')':INKS;
ctx.beginPath();ctx.arc(x,y,dots[j+6],0,6.2832);ctx.fill();}
awake=moving||age<900||px>-1e4;}

function loop(now){raf=0;if(!vis)return;draw(now);if(awake)raf=requestAnimationFrame(loop)}
function wake(){awake=true;if(!raf&&vis)raf=requestAnimationFrame(loop)}
const loc=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
hero.addEventListener('pointermove',e=>{const p=loc(e);px=p[0];py=p[1];wake()});
const leave=()=>{px=py=-1e5;wake()};
hero.addEventListener('pointerleave',leave);hero.addEventListener('pointercancel',leave);
hero.addEventListener('pointerdown',e=>{
if(reduced||e.target.closest('a,button'))return;
const p=loc(e);ring={x:p[0],y:p[1],t:performance.now()};wake()});
new ResizeObserver(()=>{layout();wake()}).observe(hero);
new IntersectionObserver(es=>{vis=es[0]?es[0].isIntersecting:true;if(vis)wake()}).observe(hero);
const start=()=>{layout();draw(performance.now());wake()};
(document.fonts&&document.fonts.load?document.fonts.load('800 100px "Inter Tight"').catch(()=>{}):Promise.resolve()).then(start);
})();
</script>
